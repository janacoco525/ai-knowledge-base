name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/rag_app/requirements-base.txt -r app/rag_app/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Syntax + import check
        run: |
          python -c "import app.rag_app.api_server"
          python -c "import app.rag_app.config"
          python -c "import app.rag_app.shared_engine"
          python -c "import app.rag_app.providers"
          python -c "import app.rag_app.rag_engine"

      - name: Run tests
        run: |
          pytest tests -q --tb=short

      - name: Health check
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.rag_app.api_server import app
          c = TestClient(app)
          # 主 /health（启动自检权威端点，返回 status=healthy）
          r = c.get('/health')
          assert r.status_code == 200 and r.json()['status'] == 'healthy', 'Main health check failed'
          # providers 注册的 /api/health（返回 status=ok）
          r2 = c.get('/api/health')
          assert r2.status_code == 200 and r2.json()['status'] == 'ok', 'API health check failed'
          print('Health checks passed')
          "

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-dist
          path: frontend/dist/
